# Example: the live config of the rhea deployment (CT 2004), without anything secret.
# Library paths must match what Unmanic sees on disk.
# pyflows profiles used by the Unmanic pyflows_transcode plugin.
# Profiles are copied verbatim from the homelab pyflows config so output policy
# matches exactly. The plugin selects a profile from the file path, so the
# libraries section is intentionally empty.
general:
  temp_dir: /tmp/pyflows-unmanic
  db_path: /tmp/pyflows-unmanic.db
  vaapi_device: /dev/dri/renderD128
  ffmpeg_path: /usr/lib/jellyfin-ffmpeg/ffmpeg
  ffprobe_path: /usr/lib/jellyfin-ffmpeg/ffprobe

profiles:
  tv:
    video:
      codec: hevc
      bit_depth: 10
      encoder: vaapi
      quality: 22
      fallback: cpu
      skip_codecs: [hevc]
    audio:
      keep_languages: [eng, spa, jpn]
      default_language: eng
      priority: [eng, spa, jpn]
      remove_commentary: true
      add_stereo:
        codec: aac
        bitrate: 128
        channels: 2
        languages: [eng, spa, jpn]
      preserve_surround: true
    subtitles:
      keep_languages: [eng, spa, jpn]
      remove_formats: [pgs, dvd_subtitle, hdmv_pgs_subtitle]
      remove_commentary: true
    output:
      container: mkv
      replace_original: true

  anime:
    video:
      codec: hevc
      bit_depth: 10
      encoder: vaapi
      quality: 23
      fallback: cpu
      skip_codecs: [hevc]
    audio:
      keep_languages: [jpn, eng, spa]
      default_language: jpn
      priority: [jpn, eng, spa]
      remove_commentary: true
      add_stereo:
        codec: aac
        bitrate: 192
        channels: 2
        languages: [jpn, eng, spa]
      preserve_surround: true
    subtitles:
      keep_languages: [eng, spa, jpn]
      remove_formats: [pgs, dvd_subtitle, hdmv_pgs_subtitle]
      remove_commentary: true
    output:
      container: mkv
      replace_original: true

  movie:
    video:
      codec: hevc
      bit_depth: 10
      encoder: vaapi
      quality: 22
      fallback: cpu
      skip_codecs: [hevc]
    audio:
      keep_languages: [eng, spa, jpn]
      default_language: eng
      priority: [eng, spa, jpn]
      remove_commentary: true
      add_stereo:
        codec: aac
        bitrate: 128
        channels: 2
        languages: [eng, spa, jpn]
      preserve_surround: true
    subtitles:
      keep_languages: [eng, spa, jpn]
      remove_formats: [pgs, dvd_subtitle, hdmv_pgs_subtitle]
      remove_commentary: true
    output:
      container: mkv
      replace_original: true

  documentary:
    video:
      codec: hevc
      bit_depth: 10
      encoder: vaapi
      quality: 22
      fallback: cpu
      skip_codecs: [hevc]
    audio:
      keep_languages: [eng, spa]
      default_language: eng
      priority: [eng, spa]
      remove_commentary: true
      add_stereo:
        codec: aac
        bitrate: 128
        channels: 2
        languages: [eng, spa]
      preserve_surround: true
    subtitles:
      keep_languages: [eng, spa]
      default_language: eng
      remove_formats: [pgs, dvd_subtitle, hdmv_pgs_subtitle]
      remove_commentary: true
    output:
      container: mkv
      replace_original: true

libraries:
  - name: Movies
    path: /hdd-media/movies
    profile: movie
  - name: TV Shows
    path: /hdd-media/tv-shows
    profile: tv
  - name: Anime
    path: /hdd-media/anime
    profile: anime
  - name: Documentaries
    path: /hdd-media/documentaries
    profile: documentary
