<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="apsis — distributed media-transcode scheduler">
  <defs>
    <!-- Cool near-black ground (matches the operator console) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>

    <!-- Amber phosphor glow behind the orbit -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0b24a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#e0b24a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c86a"/>
      <stop offset="100%" stop-color="#e0b24a"/>
    </linearGradient>

    <clipPath id="bounds"><rect width="860" height="200" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="860" height="200" rx="12" fill="url(#bg)"/>

  <!-- Faint terminal grid for depth -->
  <g clip-path="url(#bounds)" opacity="0.05" stroke="#e0b24a" stroke-width="1">
    <line x1="0" y1="40" x2="860" y2="40"/>
    <line x1="0" y1="80" x2="860" y2="80"/>
    <line x1="0" y1="120" x2="860" y2="120"/>
    <line x1="0" y1="160" x2="860" y2="160"/>
    <line x1="172" y1="0" x2="172" y2="200"/>
    <line x1="344" y1="0" x2="344" y2="200"/>
    <line x1="516" y1="0" x2="516" y2="200"/>
    <line x1="688" y1="0" x2="688" y2="200"/>
  </g>

  <!-- Orbital glyph: a central coordinator with orbiting workers; the bright
       point on the outer ring is the *apsis* — the project's namesake. -->
  <ellipse cx="100" cy="100" rx="86" ry="86" fill="url(#glow)" clip-path="url(#bounds)"/>
  <g transform="translate(100,100) rotate(-18)">
    <!-- outer orbit -->
    <ellipse rx="52" ry="31" fill="none" stroke="url(#ring)" stroke-width="1.6" opacity="0.6"/>
    <!-- inner orbit -->
    <ellipse rx="29" ry="17" fill="none" stroke="url(#ring)" stroke-width="1.4" opacity="0.32"/>
    <!-- coordinator (central body) -->
    <circle r="10" fill="url(#ring)"/>
    <circle r="10" fill="none" stroke="#0a0c10" stroke-width="1.5"/>
    <!-- orbiting workers (amber) -->
    <circle cx="-38.3" cy="19.3" r="4.2" fill="#e0b24a"/>
    <circle cx="-32.1" cy="-23.0" r="3.6" fill="#e0b24a" opacity="0.85"/>
    <!-- the apsis: brightest point at the major-axis end -->
    <circle cx="52" cy="0" r="7" fill="#e0b24a" opacity="0.28"/>
    <circle cx="52" cy="0" r="4.6" fill="#fdf3d6"/>
  </g>

  <!-- Separator -->
  <line x1="188" y1="34" x2="188" y2="166" stroke="#e0b24a" stroke-width="1.5" opacity="0.38"/>

  <!-- Wordmark (mono, echoing the console) + blinking-cursor block in amber -->
  <text x="214" y="104"
    font-family="'SF Mono','JetBrains Mono','Fira Mono',Menlo,Consolas,monospace"
    font-size="54" font-weight="600" letter-spacing="1" fill="#eef2f7">apsis</text>
  <rect x="374" y="66" width="15" height="40" fill="#e0b24a"/>

  <!-- Tagline -->
  <text x="216" y="138"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="17" font-weight="400" letter-spacing="0.4" fill="#8b95a1">Distributed media-transcode scheduler · a FOSS Unmanic successor</text>

  <!-- Tech pills -->
  <g transform="translate(216,152)"
     font-family="'SF Mono',monospace,sans-serif" font-size="10" font-weight="600" fill="#e0b24a">
    <rect x="0"   y="0" width="40" height="18" rx="4" fill="#e0b24a" opacity="0.16"/>
    <text x="20"  y="13" text-anchor="middle">rust</text>
    <rect x="48"  y="0" width="46" height="18" rx="4" fill="#e0b24a" opacity="0.16"/>
    <text x="71"  y="13" text-anchor="middle">vaapi</text>
    <rect x="102" y="0" width="40" height="18" rx="4" fill="#e0b24a" opacity="0.16"/>
    <text x="122" y="13" text-anchor="middle">nats</text>
    <rect x="150" y="0" width="36" height="18" rx="4" fill="#e0b24a" opacity="0.16"/>
    <text x="168" y="13" text-anchor="middle">cel</text>
  </g>
</svg>
