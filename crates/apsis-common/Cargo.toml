[package]
name = "apsis-common"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis shared infrastructure: wire schemas, config, NATS wiring, telemetry"

[dependencies]
apsis-engine = { path = "../apsis-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
time = { version = "0.3", features = ["serde-well-known"] }
figment = { version = "0.10", features = ["toml"] }
garde = { version = "0.23", features = ["derive"] }
humantime-serde = "1"
humantime = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-nats = "0.42"
futures = "0.3"
async-trait = "0.1"
bytes = "1"

[features]
# Test-only clip generators, shared across the worker's unit + integration tests.
# Off by default so nothing here compiles into a release build.
testkit = []

[dev-dependencies]
# Only the tests drive an async runtime (#[tokio::test]); the library itself uses
# std::sync primitives and awaits async-nats futures without spawning.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
