[package]
name = "apsis-worker"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis worker: run / verify / replace, backends"

[dependencies]
apsis-common = { path = "../apsis-common" }
apsis-engine = { path = "../apsis-engine" }
async-nats = "0.42"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "time",
] }
ulid = "1"

[lints]
workspace = true
