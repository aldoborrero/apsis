[package]
name = "apsis-worker"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis worker: run / verify / replace, backends"

[dependencies]
apsis-common = { path = "../apsis-common" }
apsis-engine = { path = "../apsis-engine" }
async-nats = "0.42"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
futures = "0.3"
# renameat2(RENAME_EXCHANGE) for the atomic in-place replace (close the source-
# changed-during-transcode TOCTOU); safe wrapper so the forbid-unsafe lint holds.
nix = { version = "0.31", features = ["fs"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "io-util",
  "time",
] }
ulid = "1"

[dev-dependencies]
# Enable the shared clip generators for the worker's unit + integration tests only
# (off in a normal build, so they never ship in the binary).
apsis-common = { path = "../apsis-common", features = ["testkit"] }

[lints]
workspace = true
