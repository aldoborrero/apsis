[package]
name = "apsis-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis transcode planner and ffmpeg command builder (port of pyflows _engine)"

[features]
# Optional helper that shells out to ffprobe; the core is pure (parses JSON).
probe-exec = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CEL profile-rule overrides (US2). The clarkmcc/cel-rust project, renamed from
# `cel-interpreter` (≤0.10) to `cel` — a pure, side-effect-free expression evaluator.
cel = { version = "0.14", features = ["json"] }
# garde (profile validation) is added in the Foundational phase with config.rs.

[lints]
workspace = true
