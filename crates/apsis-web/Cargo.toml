[package]
name = "apsis-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis operator console — a Leptos read-mostly UI over the spec 005 control protocol"

# cdylib for the wasm (hydrate) bundle; rlib for the ssr server + tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
axum = { version = "0.8", optional = true }
leptos_axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
# Pinned to match the nixpkgs `wasm-bindgen-cli` in the dev shell (cargo-leptos needs an
# exact version match between the crate and the CLI that generates the JS/WASM glue).
wasm-bindgen = { version = "=0.2.121", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Server-only: the NATS bridge (control types, KvStateStore, connect). ssr feature only —
# never compiled into the wasm client.
apsis-common = { path = "../apsis-common", optional = true }
async-nats = { version = "0.42", optional = true }
time = { version = "0.3", features = ["formatting"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[features]
default = ["ssr"]
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen"]
ssr = [
    "dep:axum",
    "dep:tokio",
    "dep:leptos_axum",
    "dep:apsis-common",
    "dep:async-nats",
    "dep:time",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# Leptos/wasm-bindgen generated code trips the workspace's forbid-unsafe / pedantic lints,
# so this crate does NOT inherit `[lints] workspace = true`.

[package.metadata.leptos]
output-name = "apsis-web"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
