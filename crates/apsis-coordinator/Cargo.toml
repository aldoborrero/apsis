[package]
name = "apsis-coordinator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "apsis coordinator: scan / reconcile / enqueue"

[dependencies]
apsis-common = { path = "../apsis-common" }
apsis-engine = { path = "../apsis-engine" }
async-nats = "0.42"
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "time",
] }
ulid = "1"
walkdir = "2"

[lints]
workspace = true
